name: Enrich Batch (hourly, free-tier structural fix)

# ---------------------------------------------------------------------------
# Why this workflow exists:
#
# Vercel Hobby (free tier, permanently fixed — see AISCENTRA-RELEASE-*
# task history) allows exactly one native Vercel Cron trigger for this
# project, already used by /api/cron/pipeline at "0 10 * * *" (once daily).
# Diagnostic work confirmed the actual bottleneck is not any single
# platform limit (Supabase DB size, connections, Groq token limits were
# all found to have large headroom) but a pure throughput mismatch:
# observations are collected at ~400/day while the once-daily pipeline
# only drains a handful of them per invocation, producing an
# ever-growing backlog.
#
# GitHub Actions' own `schedule:` trigger is free, unrelated to Vercel's
# cron-count limit, and already used elsewhere in this repository (CI).
# This workflow calls the existing, already-authenticated
# /api/enrich/batch endpoint directly over HTTPS, once per hour, using
# the same CRON_SECRET the Vercel-native cron already uses — no change
# to the endpoint's own authorization logic was needed.
#
# This does NOT change BATCH_SIZE or TIME_BUDGET inside enrich/batch
# itself (explicitly out of scope for this task) -- it only calls the
# existing endpoint more often, so its own internal autonomous loop
# (which already runs until the queue is empty or its internal time
# budget is exhausted) gets many more opportunities per day to drain
# the backlog, instead of just one.
# ---------------------------------------------------------------------------

on:
  schedule:
    # SIX cycles per day, deliberately NOT hourly.
    #
    # Hourly (24 cycles) structurally overspends Groq's TPD: at the
    # measured ~2,526 tokens per 70b enrichment call and ~5 observations
    # per 50s invocation, 24 cycles demand roughly 303,000 tokens/day
    # against a 100,000 limit -- ~303%. That overspend is the direct
    # cause of the 24 observed HTTP 429 "tokens per day (TPD)" refusals.
    #
    # Six cycles land at roughly 76,000 tokens/day (~76%), leaving real
    # headroom above the Signal Engine's own consumption.
    #
    # FIVE slots here, not six: the Vercel cron at 10:00 UTC
    # (vercel.json) drives /api/cron/pipeline, which itself awaits
    # /api/enrich/batch and is therefore a sixth enrichment cycle.
    # 5 + 1 = exactly 6 automatic enrichment cycles per day.
    #
    # Offsets are :30 and deliberately avoid the 10:00 hour entirely, so
    # no GitHub-scheduled run can overlap the Vercel one -- overlapping
    # would put two enrichment loops against the same shared TPD budget
    # at one predictable moment each day.
    #
    # Resulting daily schedule (UTC):
    #   01:30  05:30  [10:00 Vercel]  13:30  17:30  21:30
    - cron: '30 1,5,13,17,21 * * *'
  workflow_dispatch: {} # manual trigger for testing/on-demand drain

# Serializes every trigger of this workflow -- scheduled AND manual.
# Without it, a manual dispatch during a scheduled run (or a slow run
# overlapping the next tick) puts two enrichment loops against the same
# shared TPD budget simultaneously.
#
# cancel-in-progress is false on purpose: an in-flight run has already
# spent Groq tokens and may hold observations mid-processing. Killing it
# would waste that spend and risk leaving rows requeued unnecessarily;
# queueing behind it is strictly safer.
concurrency:
  group: enrich-batch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger-enrich-batch:
    name: Trigger /api/enrich/batch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call enrich/batch endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://aiscentra.com' }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET repository secret is not set. Configure it in GitHub repo Settings > Secrets and variables > Actions before this workflow can call the endpoint."
            exit 1
          fi

          HTTP_STATUS="$(curl -sS -o /tmp/enrich-response.json -w '%{http_code}' \
            -X POST "${APP_URL}/api/enrich/batch" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{}')"

          echo "HTTP status: $HTTP_STATUS"
          echo "--- response body ---"
          cat /tmp/enrich-response.json
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "::notice::enrich/batch call succeeded (HTTP $HTTP_STATUS)."
          else
            echo "::error::enrich/batch call failed with HTTP $HTTP_STATUS."
            exit 1
          fi

          rm -f /tmp/enrich-response.json
