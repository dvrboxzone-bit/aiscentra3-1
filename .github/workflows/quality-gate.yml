name: Quality Gate

# Restores the minimum mandatory CI baseline for pull requests into main:
# npm ci, changed-files format check, lint, type-check, tests, build.
# Runs on a free GitHub-hosted runner. No production secrets, no Supabase/
# Vercel access, no paid resources.
#
# Security note: npm audit steps below are EVIDENCE ONLY. This workflow
# does NOT declare a Security Gate PASS/FAIL and does NOT run
# `npm audit fix`. Known advisories are tracked and remediated as a
# separate, dedicated task after independent review.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate (format, lint, type-check, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (full history for merge-base computation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm tested commit identity
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
          echo "git.head=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Fetch base branch explicitly (do not rely on unconfirmed origin/<base> presence)
        # actions/checkout with fetch-depth:0 fetches full history of the
        # checked-out ref, but does not guarantee other branches (e.g. the
        # PR's base branch) exist as local remote-tracking refs. Fetching
        # the base branch explicitly here makes the merge-base computation
        # in format-changed.sh provably correct rather than assumed.
        # PR-only: github.base_ref is empty on push events.
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: Changed-files format check (pull_request)
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/format-changed.sh "origin/${{ github.base_ref }}"

      - name: Changed-files format check (push to main)
        # github.event.before is the SHA main pointed to immediately before
        # this push. Fail-closed: any condition where that SHA cannot be
        # trusted (missing, all-zero i.e. a new-branch/force-push edge case,
        # or not present in this checkout's local history) falls back to a
        # full-repository format check rather than silently skipping or
        # comparing main against itself. No `|| true` anywhere in this step.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"

          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "No valid before SHA; running full format check."
            npm run format:check
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            bash scripts/ci/format-changed.sh "$BEFORE"
          else
            echo "Before SHA is not available locally; running full format check."
            npm run format:check
          fi

      - name: Lint (full project)
        run: npm run lint

      - name: TypeScript type-check
        run: npm run type-check

      - name: Automated tests
        run: npm test

      - name: API boundary inventory check
        # Verifies docs/audits/api-boundary-inventory.json is complete and
        # internally consistent against the actual src/app/api tree. Does
        # NOT constitute a Security Gate PASS -- rateLimit:"missing" and
        # budgetGuard:"missing" are honestly-registered debt, not a
        # passing control. See docs/audits/API_BOUNDARY_INVENTORY.md.
        run: npm run check:api-inventory

      - name: PostgreSQL integration test (budget atomicity + execution lock)
        # MANDATORY gate, not evidence-only. The concurrency guarantees
        # this project depends on -- one budget reservation admitted out
        # of N concurrent, one enrichment cycle admitted out of two
        # competing triggers -- cannot be proven by a JS mock. This
        # boots a throwaway PostgreSQL, applies the real migration and
        # exercises the real functions over real concurrent connections.
        # The script fails (never skips) if PostgreSQL is unavailable.
        run: bash scripts/ci/pg-integration-test.sh

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          ADMIN_EMAIL: admin@placeholder.invalid

      - name: Dependency audit evidence (production only) — evidence only, not a gate
        if: always()
        # No blanket `|| true`. npm audit's own non-zero exit code (caused
        # by known, already-tracked vulnerabilities) is captured explicitly
        # and surfaced as evidence, NOT swallowed. This step only tolerates
        # that specific, expected non-zero exit -- it still fails the
        # workflow on a genuine operational failure (network error,
        # malformed JSON, a top-level `error` field, or missing `metadata`),
        # since those indicate the audit did not actually run, which must
        # not be silently treated as "no vulnerabilities found".
        run: |
          set +e
          npm audit --omit=dev --json > audit-production.json
          AUDIT_EXIT=$?
          set -e

          node <<'NODE'
          const fs = require('fs')
          const value = JSON.parse(fs.readFileSync('audit-production.json', 'utf8'))

          if (value.error) {
            console.error('npm audit returned an operational error:')
            console.error(JSON.stringify(value.error, null, 2))
            process.exit(1)
          }

          if (!value.metadata) {
            console.error('npm audit JSON does not contain metadata')
            process.exit(1)
          }
          NODE

          echo "npm audit --omit=dev exit code: ${AUDIT_EXIT}"

      - name: Dependency audit evidence (full) — evidence only, not a gate
        if: always()
        run: |
          set +e
          npm audit --json > audit-full.json
          AUDIT_EXIT=$?
          set -e

          node <<'NODE'
          const fs = require('fs')
          const value = JSON.parse(fs.readFileSync('audit-full.json', 'utf8'))

          if (value.error) {
            console.error('npm audit returned an operational error:')
            console.error(JSON.stringify(value.error, null, 2))
            process.exit(1)
          }

          if (!value.metadata) {
            console.error('npm audit JSON does not contain metadata')
            process.exit(1)
          }
          NODE

          echo "npm audit exit code: ${AUDIT_EXIT}"

      - name: Upload quality logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-logs
          path: |
            audit-production.json
            audit-full.json
          retention-days: 30

      - name: Upload production audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-production
          path: audit-production.json
          retention-days: 30

      - name: Upload full audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-full
          path: audit-full.json
          retention-days: 30
