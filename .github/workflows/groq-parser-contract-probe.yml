name: Groq 120b Parser Contract Probe (manual, one call)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: groq-120b-parser-contract-probe
  cancel-in-progress: false

jobs:
  probe:
    name: One synthetic parser-contract request
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    env:
      EVENT_NAME: ${{ github.event_name }}
      ACTOR_NAME: ${{ github.actor }}
      OWNER_NAME: ${{ github.repository_owner }}
    steps:
      - name: Fail closed before checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = "workflow_dispatch"
          test "$ACTOR_NAME" = "$OWNER_NAME"

      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Execute exactly one synthetic Groq request
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GROQ_API_KEY:-}" ]]; then
            echo "::error::BLOCKED: GROQ_API_KEY is unavailable"
            exit 2
          fi
          node --import tsx scripts/diagnostics/groq-parser-contract-probe.ts
