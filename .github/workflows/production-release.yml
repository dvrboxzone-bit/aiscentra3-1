name: Production Release (manual, exact SHA)

# Phase 1C-B2 -- manual production release, structurally separate from
# merging to main. This workflow is the ONLY intended path to a
# production Vercel deployment once vercel.json's
# git.deploymentEnabled.main = false takes effect. It is never
# triggered automatically by push/pull_request/schedule -- only by an
# explicit, authenticated workflow_dispatch from the repository owner.
#
# Every gate below is written fail-closed: any unexpected condition
# stops the job before any deploy/promote action is taken. This
# workflow never performs an automatic rollback -- rollback is
# explicitly out of scope here and requires its own separate, explicit
# owner authorization at the time it is needed.
#
# This workflow does NOT create the `production` GitHub Environment or
# its VERCEL_TOKEN secret. Both must be configured by the repository
# owner exactly as documented in this PR's Evidence Manifest and in
# docs/governance/decisions/PHASE_1C_DEPLOYMENT_SEPARATION.md before
# this workflow can be run for the first time.
#
# Security note: every `${{ inputs.* }}` / `${{ github.* }}` value used
# inside a shell script is passed through a step-level `env:` block and
# read from an ordinary shell variable -- never interpolated directly
# into `run:` source. GitHub Actions expands `${{ ... }}` before the
# runner script is written to disk; interpolating an attacker-influenced
# string (workflow_dispatch inputs are user-controlled) directly into
# `run:` is a script-injection vector. Passing through `env:` avoids
# this because the value only ever reaches the shell as the *contents*
# of a variable, never as literal script text.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full 40-character commit SHA on main to release'
        required: true
        type: string
      confirmation:
        description: 'Must be exactly RELEASE to proceed'
        required: true
        type: string
      reason:
        description: 'Short, non-empty reason for this release'
        required: true
        type: string

concurrency:
  group: aiscentra-production-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  # Team ID: used for Vercel REST API calls (teamId query parameter).
  VERCEL_ORG_ID: team_kcxAeWtnmoE4vJPkVHy2vbjT
  # Team slug: used for Vercel CLI --scope (CLI --scope expects a slug,
  # not a Team ID -- see corrected Section 2.5 handling below). Observed
  # directly this session in every Vercel deployment hostname returned
  # by the connected Vercel MCP tool (e.g.
  # aiscentra3-1-<hash>-welvers-projects.vercel.app), corroborating this
  # value independently of this task's own suggestion.
  VERCEL_TEAM_SLUG: welvers-projects
  VERCEL_PROJECT_ID: prj_CSXbFWdA5q0xM5F0oQ57eKn1W3zF
  EXPECTED_PROJECT_NAME: aiscentra3-1
  # Confirmed directly against the public npm registry this task:
  # GET https://registry.npmjs.org/vercel/58.4.4 returns name=vercel,
  # version=58.4.4, a resolvable dist.tarball -- not a search snippet,
  # not a memory recollection. Never use vercel@latest.
  VERCEL_CLI_VERSION: '58.4.4'
  PRODUCTION_ALIAS_1: aiscentra.com
  PRODUCTION_ALIAS_2: www.aiscentra.com
  PNG_SIGNATURE_HEX: '89504e470d0a1a0a'

jobs:
  # ---------------------------------------------------------------------
  # Job 1: owner / ref / input gate. No secrets. All user-controlled
  # values arrive only via env:, never interpolated into run: source.
  # ---------------------------------------------------------------------
  validate:
    name: Owner / ref / input gate (no secrets)
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.gate.outputs.commit_sha }}
    steps:
      - name: Fail closed on event/ref/actor/confirmation/input shape
        id: gate
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_REASON: ${{ inputs.reason }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          ACTOR_NAME: ${{ github.actor }}
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::Must be triggered by workflow_dispatch only. Got: $EVENT_NAME"
            exit 1
          fi

          if [ "$REF_NAME" != "refs/heads/main" ]; then
            echo "::error::Must be run against refs/heads/main only. Got: $REF_NAME"
            exit 1
          fi

          if [ "$ACTOR_NAME" != "$OWNER_NAME" ]; then
            echo "::error::May only be dispatched by the repository owner. actor=$ACTOR_NAME owner=$OWNER_NAME"
            exit 1
          fi

          if [ "$INPUT_CONFIRMATION" != "RELEASE" ]; then
            echo "::error::confirmation input must be exactly RELEASE"
            exit 1
          fi

          # Reason must contain at least one non-whitespace character.
          # Never echoed in full to logs -- only its length is reported.
          REASON_TRIMMED="$(printf '%s' "$INPUT_REASON" | tr -d '[:space:]')"
          if [ -z "$REASON_TRIMMED" ]; then
            echo "::error::reason input must contain at least one non-whitespace character"
            exit 1
          fi

          # Normalize to lowercase, since GitHub SHA strings are
          # lowercase, before format validation and all downstream
          # comparisons/output.
          COMMIT_SHA="$(printf '%s' "$INPUT_COMMIT_SHA" | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be exactly 40 hex characters (upper/lowercase accepted, normalized to lowercase)"
            exit 1
          fi

          echo "All owner/ref/input gates passed. reason length: ${#INPUT_REASON} characters."
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Job 2: exact main SHA gate + canonical push-event Quality Gate check.
  # No secrets.
  # ---------------------------------------------------------------------
  exact-sha-check:
    name: Exact main SHA + canonical Quality Gate check (no secrets)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      qg_run_id: ${{ steps.qg.outputs.run_id }}
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch origin/main explicitly
        run: git fetch origin main

      - name: Confirm commit exists and is an ancestor of origin/main
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "${COMMIT_SHA}^{commit}" 2>/dev/null; then
            echo "::error::commit_sha $COMMIT_SHA does not exist in this checkout's history"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "::error::commit_sha $COMMIT_SHA is not an ancestor of origin/main"
            exit 1
          fi

      - name: Confirm input SHA exactly equals current origin/main HEAD
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          MAIN_HEAD="$(git rev-parse origin/main)"

          if [ "$COMMIT_SHA" != "$MAIN_HEAD" ]; then
            echo "::error::commit_sha ($COMMIT_SHA) != current origin/main HEAD ($MAIN_HEAD). main has moved. STOP."
            exit 1
          fi

      - name: Checkout detached exact input SHA and verify
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail

          git checkout --detach "$COMMIT_SHA"

          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if [ "$ACTUAL_HEAD" != "$COMMIT_SHA" ]; then
            echo "::error::git rev-parse HEAD ($ACTUAL_HEAD) != input commit_sha ($COMMIT_SHA)"
            exit 1
          fi
          echo "Confirmed: detached HEAD exactly equals input commit_sha ($ACTUAL_HEAD)."

      - name: Query canonical push-event Quality Gate run for this exact SHA
        id: qg
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RESPONSE="$(gh api "repos/${REPO}/actions/workflows/quality-gate.yml/runs?event=push&branch=main&per_page=20")"

          RUN_JSON="$(echo "$RESPONSE" | jq -c --arg sha "$COMMIT_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")] | first')"

          if [ "$RUN_JSON" = "null" ] || [ -z "$RUN_JSON" ]; then
            echo "::error::No completed, successful push-event Quality Gate run found for exact head_sha=$COMMIT_SHA. STOP before deploy."
            exit 1
          fi

          RUN_ID="$(echo "$RUN_JSON" | jq -r '.id')"
          RUN_EVENT="$(echo "$RUN_JSON" | jq -r '.event')"
          RUN_HEAD_SHA="$(echo "$RUN_JSON" | jq -r '.head_sha')"
          RUN_CONCLUSION="$(echo "$RUN_JSON" | jq -r '.conclusion')"

          echo "Quality Gate evidence (safe fields only):"
          echo "  run_id=$RUN_ID"
          echo "  event=$RUN_EVENT"
          echo "  head_sha=$RUN_HEAD_SHA"
          echo "  conclusion=$RUN_CONCLUSION"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Job 3: Vercel Team single-project invariant. First job requiring the
  # VERCEL_TOKEN Environment secret. Uses Vercel's documented v9 Projects
  # REST API directly (not CLI table-output parsing).
  # ---------------------------------------------------------------------
  team-project-invariant:
    name: Vercel Team single-project invariant (uses VERCEL_TOKEN)
    needs: [validate, exact-sha-check]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm Team contains exactly one project, matching expected ID/name
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not set. This job must run under environment: production with the VERCEL_TOKEN Environment secret configured. STOP."
            exit 1
          fi

          HTTP_STATUS="$(curl -sS -o /tmp/vercel-projects.json -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects?teamId=${VERCEL_ORG_ID}&limit=100")"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Vercel projects API call failed with HTTP $HTTP_STATUS. STOP."
            exit 1
          fi

          PROJECT_COUNT="$(jq -e '.projects | length' /tmp/vercel-projects.json)"
          if [ "$PROJECT_COUNT" != "1" ]; then
            echo "::error::Expected exactly 1 project in team ${VERCEL_ORG_ID}, found $PROJECT_COUNT. STOP -- single-project invariant violated."
            exit 1
          fi

          ACTUAL_PROJECT_ID="$(jq -er '.projects[0].id' /tmp/vercel-projects.json)"
          ACTUAL_PROJECT_NAME="$(jq -er '.projects[0].name' /tmp/vercel-projects.json)"

          if [ "$ACTUAL_PROJECT_ID" != "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Single project ID mismatch. expected=$VERCEL_PROJECT_ID actual=$ACTUAL_PROJECT_ID. STOP."
            exit 1
          fi

          if [ "$ACTUAL_PROJECT_NAME" != "$EXPECTED_PROJECT_NAME" ]; then
            echo "::error::Single project name mismatch. expected=$EXPECTED_PROJECT_NAME actual=$ACTUAL_PROJECT_NAME. STOP."
            exit 1
          fi

          rm -f /tmp/vercel-projects.json
          echo "Team single-project invariant confirmed: count=1, id=$ACTUAL_PROJECT_ID, name=$ACTUAL_PROJECT_NAME."

  # ---------------------------------------------------------------------
  # Job 4: staged production deploy (--skip-domain, no alias assignment).
  # stdout and stderr are captured separately; the deployment URL is
  # read only from stdout, per Vercel CLI's documented contract.
  # ---------------------------------------------------------------------
  staged-deploy:
    name: Staged production deploy (Vercel CLI, --skip-domain)
    needs: [validate, exact-sha-check, team-project-invariant]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Checkout exact release commit
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Re-confirm current origin/main HEAD still equals input SHA (immediately pre-deploy)
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_HEAD="$(git rev-parse origin/main)"
          if [ "$COMMIT_SHA" != "$MAIN_HEAD" ]; then
            echo "::error::main moved since exact-sha-check ($MAIN_HEAD != $COMMIT_SHA). STOP -- do not deploy."
            exit 1
          fi

      - name: Print pinned Vercel CLI version
        run: npx --yes vercel@${VERCEL_CLI_VERSION} --version

      - name: Deploy exact checked-out tree as staged production (no domain assignment)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Vercel CLI's documented contract: stdout carries the
          # Deployment URL; stderr carries progress/error text. Capture
          # them separately -- merging with 2>&1 destroys that contract
          # and makes the final line unreliable as a URL source.
          set +e
          npx --yes vercel@${VERCEL_CLI_VERSION} deploy \
            --prod \
            --skip-domain \
            --yes \
            --meta aiscentraReleaseSha="$COMMIT_SHA" \
            --meta githubActionsRunId="$RUN_ID" \
            1>/tmp/deploy-stdout.txt 2>/tmp/deploy-stderr.txt
          DEPLOY_EXIT_CODE=$?
          set -e

          if [ "$DEPLOY_EXIT_CODE" -ne 0 ]; then
            echo "::error::vercel deploy exited non-zero ($DEPLOY_EXIT_CODE). STOP. (stderr not printed in full; see runner artifact/log retention policy for the raw file if needed.)"
            exit 1
          fi

          # Collect every full, non-empty https:// URL line on stdout,
          # WITHOUT deduplication -- each occurrence is counted, even if
          # two lines contain the identical URL. Exactly one line is a
          # pass; zero lines means no URL was printed; two or more lines
          # (identical or not) is ambiguous and must not be silently
          # resolved by picking the last line or collapsing duplicates.
          set +e
          ALL_URLS="$(grep -Eo '^https://[A-Za-z0-9.-]+$' /tmp/deploy-stdout.txt)"
          URL_COUNT="$(printf '%s\n' "$ALL_URLS" | grep -c .)"
          set -e

          if [ "$URL_COUNT" -eq 0 ]; then
            echo "::error::No https:// deployment URL found on vercel deploy stdout. STOP."
            exit 1
          fi

          if [ "$URL_COUNT" -gt 1 ]; then
            echo "::error::Expected exactly one deployment URL line on stdout, found $URL_COUNT (duplicates are not collapsed and do not pass). Ambiguous -- STOP, do not guess."
            exit 1
          fi

          DEPLOYMENT_URL="$ALL_URLS"

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Could not read a deployment URL from vercel deploy stdout. STOP."
            exit 1
          fi

          if ! [[ "$DEPLOYMENT_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Parsed deployment URL does not match the expected https:// host shape. STOP."
            exit 1
          fi

          echo "Staged deployment created: $DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          rm -f /tmp/deploy-stdout.txt /tmp/deploy-stderr.txt

  # ---------------------------------------------------------------------
  # Job 5: deployment metadata gate. Confirms via Vercel API (system
  # githubCommitSha, not just custom metadata) that this exact deployment
  # corresponds to the exact release SHA and is not yet aliased to
  # production domains.
  # ---------------------------------------------------------------------
  deployment-metadata-gate:
    name: Deployment metadata gate (system githubCommitSha, no alias yet)
    needs: [validate, staged-deploy]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deployment_id: ${{ steps.check.outputs.deployment_id }}
    steps:
      - name: Fail-closed check of deployment state, target, system SHA, aliases
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          DEPLOYMENT_URL: ${{ needs.staged-deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          DEPLOYMENT_HOST="${DEPLOYMENT_URL#https://}"

          HTTP_STATUS="$(curl -sS -o /tmp/deployment.json -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${DEPLOYMENT_HOST}?teamId=${VERCEL_ORG_ID}")"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Vercel deployment lookup failed with HTTP $HTTP_STATUS. STOP."
            exit 1
          fi

          DEPLOYMENT_ID="$(jq -er '.id' /tmp/deployment.json)"
          READY_STATE="$(jq -er '.readyState' /tmp/deployment.json)"
          TARGET="$(jq -er '.target' /tmp/deployment.json)"
          SYSTEM_SHA="$(jq -r '.meta.githubCommitSha // empty' /tmp/deployment.json)"
          CUSTOM_SHA="$(jq -r '.meta.aiscentraReleaseSha // empty' /tmp/deployment.json)"

          if [ "$READY_STATE" != "READY" ]; then
            echo "::error::Deployment readyState is '$READY_STATE', expected READY. STOP."
            exit 1
          fi

          if [ "$TARGET" != "production" ]; then
            echo "::error::Deployment target is '$TARGET', expected production. STOP."
            exit 1
          fi

          if [ -z "$SYSTEM_SHA" ]; then
            echo "::error::System githubCommitSha is missing on this deployment. Custom metadata alone (aiscentraReleaseSha=$CUSTOM_SHA) is NOT sufficient. STOP."
            exit 1
          fi

          if [ "$SYSTEM_SHA" != "$COMMIT_SHA" ]; then
            echo "::error::System githubCommitSha ($SYSTEM_SHA) != release commit_sha ($COMMIT_SHA). STOP."
            exit 1
          fi

          if [ "$CUSTOM_SHA" != "$COMMIT_SHA" ]; then
            echo "::error::Custom aiscentraReleaseSha metadata ($CUSTOM_SHA) != release commit_sha ($COMMIT_SHA). STOP."
            exit 1
          fi

          ALIAS_COUNT="$(jq -e '(.alias // []) | length' /tmp/deployment.json)"
          HAS_PROD_ALIAS="$(jq -er --arg a1 "$PRODUCTION_ALIAS_1" --arg a2 "$PRODUCTION_ALIAS_2" \
            '(.alias // []) | map(select(. == $a1 or . == $a2)) | length' /tmp/deployment.json)"

          if [ "$HAS_PROD_ALIAS" != "0" ]; then
            echo "::error::Deployment is unexpectedly already aliased to a production domain before promotion. STOP."
            exit 1
          fi

          echo "Deployment metadata gate passed: id=$DEPLOYMENT_ID readyState=$READY_STATE target=$TARGET systemSha=$SYSTEM_SHA aliasCount(pre-promotion)=$ALIAS_COUNT"
          rm -f /tmp/deployment.json
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Job 6: staged smoke, before any promotion. Uses documented
  # `vercel curl /path --deployment <url>` syntax (a path plus
  # --deployment, not a full URL as the path argument), which bypasses
  # Vercel's own Deployment Protection using the caller's own Vercel
  # auth -- no separate bypass secret is introduced.
  # ---------------------------------------------------------------------
  staged-smoke:
    name: Staged smoke test (pre-promotion)
    needs: [validate, staged-deploy, deployment-metadata-gate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Root path smoke (HTTP 200, recognizable AIscentra HTML)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ needs.staged-deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail

          set +e
          npx --yes vercel@${VERCEL_CLI_VERSION} curl / \
            --deployment "$DEPLOYMENT_URL" \
            -- -o /tmp/root.html -D /tmp/root-headers.txt -w '%{http_code}' > /tmp/root-status.txt 2>/tmp/root-curl-stderr.txt
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::vercel curl / failed with exit code $CURL_EXIT. STOP -- do not promote."
            echo "--- captured stderr (token redacted) ---"
            sed "s/${VERCEL_TOKEN}/[REDACTED]/g" /tmp/root-curl-stderr.txt 2>/dev/null
            exit 1
          fi

          STATUS="$(cat /tmp/root-status.txt)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Root path returned HTTP $STATUS, expected 200. STOP -- do not promote."
            exit 1
          fi

          if ! grep -qi "aiscentra" /tmp/root.html; then
            echo "::error::Root path did not return recognizable AIscentra HTML. STOP -- do not promote."
            exit 1
          fi

          echo "Root path smoke: HTTP $STATUS, recognizable AIscentra content confirmed."
          rm -f /tmp/root.html /tmp/root-headers.txt /tmp/root-status.txt /tmp/root-curl-stderr.txt

      - name: Health path smoke (HTTP 200, status=ok, database=ok, fail-closed jq -e)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ needs.staged-deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail

          set +e
          npx --yes vercel@${VERCEL_CLI_VERSION} curl /api/health \
            --deployment "$DEPLOYMENT_URL" \
            -- -o /tmp/health.json -w '%{http_code}' > /tmp/health-status.txt 2>/tmp/health-curl-stderr.txt
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::vercel curl /api/health failed with exit code $CURL_EXIT. STOP -- do not promote."
            echo "--- captured stderr (token redacted) ---"
            sed "s/${VERCEL_TOKEN}/[REDACTED]/g" /tmp/health-curl-stderr.txt 2>/dev/null
            exit 1
          fi

          STATUS="$(cat /tmp/health-status.txt)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::/api/health returned HTTP $STATUS, expected 200. STOP -- do not promote."
            exit 1
          fi

          # jq -e: exits non-zero if the filter output is false/null, or
          # on invalid JSON -- fail-closed by construction.
          if ! jq -e '.status == "ok"' /tmp/health.json > /dev/null; then
            echo "::error::/api/health .status is not \"ok\". STOP -- do not promote."
            exit 1
          fi

          if ! jq -e '.checks.database == "ok"' /tmp/health.json > /dev/null; then
            echo "::error::/api/health .checks.database is not \"ok\". STOP -- do not promote."
            exit 1
          fi

          echo "Health path smoke: HTTP $STATUS, status=ok, database=ok."
          rm -f /tmp/health.json /tmp/health-status.txt /tmp/health-curl-stderr.txt

      - name: Open Graph image smoke (HTTP 200, image/png, PNG signature)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ needs.staged-deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail

          set +e
          npx --yes vercel@${VERCEL_CLI_VERSION} curl /opengraph-image \
            --deployment "$DEPLOYMENT_URL" \
            -- -o /tmp/og.png -D /tmp/og-headers.txt -w '%{http_code}' > /tmp/og-status.txt 2>/tmp/og-curl-stderr.txt
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::vercel curl /opengraph-image failed with exit code $CURL_EXIT. STOP -- do not promote."
            echo "--- captured stderr (token redacted) ---"
            sed "s/${VERCEL_TOKEN}/[REDACTED]/g" /tmp/og-curl-stderr.txt 2>/dev/null
            exit 1
          fi

          STATUS="$(cat /tmp/og-status.txt)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::/opengraph-image returned HTTP $STATUS, expected 200. STOP -- do not promote."
            exit 1
          fi

          CONTENT_TYPE="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{print $2; exit}' /tmp/og-headers.txt | tr -d '\r')"
          if [ -z "$CONTENT_TYPE" ]; then
            echo "::error::No content-type header found in /opengraph-image response. STOP -- do not promote."
            exit 1
          fi
          if [[ "$CONTENT_TYPE" != image/png* ]]; then
            echo "::error::/opengraph-image content-type is '$CONTENT_TYPE', expected image/png. STOP -- do not promote."
            exit 1
          fi

          PNG_SIGNATURE="$(head -c8 /tmp/og.png | xxd -p | head -c16)"
          if [ "$PNG_SIGNATURE" != "$PNG_SIGNATURE_HEX" ]; then
            echo "::error::/opengraph-image body does not start with the PNG signature. STOP -- do not promote."
            exit 1
          fi

          echo "Open Graph smoke: HTTP $STATUS, content-type=$CONTENT_TYPE, PNG signature confirmed."
          rm -f /tmp/og.png /tmp/og-headers.txt /tmp/og-status.txt /tmp/og-curl-stderr.txt

  # ---------------------------------------------------------------------
  # Job 7: TOCTOU re-check immediately before promotion. Fully repeats
  # every gate above against current live state -- main HEAD, exact-SHA
  # Quality Gate, Team invariant (count + exact ID + exact name),
  # deployment metadata (READY, target, system SHA, custom SHA, zero
  # production aliases), AND the full staged smoke (root/health/PNG) --
  # not merely a subset, and not merely relying on earlier job outputs.
  # ---------------------------------------------------------------------
  pre-promotion-recheck:
    name: TOCTOU re-check immediately before promotion (full repeat)
    needs: [validate, exact-sha-check, staged-deploy, deployment-metadata-gate, staged-smoke]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Re-confirm origin/main HEAD still equals release commit_sha
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_HEAD="$(git rev-parse origin/main)"
          if [ "$COMMIT_SHA" != "$MAIN_HEAD" ]; then
            echo "::error::main moved since approval ($MAIN_HEAD != $COMMIT_SHA). STOP -- do not promote."
            exit 1
          fi

      - name: Re-confirm exact push-event Quality Gate is still success
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RESPONSE="$(gh api "repos/${REPO}/actions/workflows/quality-gate.yml/runs?event=push&branch=main&per_page=20")"
          STILL_SUCCESS="$(echo "$RESPONSE" | jq -er --arg sha "$COMMIT_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")] | length')"

          if [ "$STILL_SUCCESS" = "0" ]; then
            echo "::error::Exact-SHA push Quality Gate is no longer confirmed success. STOP -- do not promote."
            exit 1
          fi

      - name: Re-confirm Team single-project invariant (count + exact ID + exact name)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          HTTP_STATUS="$(curl -sS -o /tmp/vercel-projects-recheck.json -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects?teamId=${VERCEL_ORG_ID}&limit=100")"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Vercel projects API re-check failed with HTTP $HTTP_STATUS. STOP -- do not promote."
            exit 1
          fi

          PROJECT_COUNT="$(jq -e '.projects | length' /tmp/vercel-projects-recheck.json)"
          if [ "$PROJECT_COUNT" != "1" ]; then
            echo "::error::Team single-project invariant no longer holds (count=$PROJECT_COUNT). STOP -- do not promote."
            exit 1
          fi

          RECHECK_PROJECT_ID="$(jq -er '.projects[0].id' /tmp/vercel-projects-recheck.json)"
          RECHECK_PROJECT_NAME="$(jq -er '.projects[0].name' /tmp/vercel-projects-recheck.json)"

          if [ "$RECHECK_PROJECT_ID" != "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Re-check project ID mismatch. expected=$VERCEL_PROJECT_ID actual=$RECHECK_PROJECT_ID. STOP -- do not promote."
            exit 1
          fi

          if [ "$RECHECK_PROJECT_NAME" != "$EXPECTED_PROJECT_NAME" ]; then
            echo "::error::Re-check project name mismatch. expected=$EXPECTED_PROJECT_NAME actual=$RECHECK_PROJECT_NAME. STOP -- do not promote."
            exit 1
          fi

          rm -f /tmp/vercel-projects-recheck.json
          echo "Team single-project invariant re-confirmed: count=1, id=$RECHECK_PROJECT_ID, name=$RECHECK_PROJECT_NAME."

      - name: Re-confirm full deployment metadata (READY, target, system SHA, custom SHA, zero aliases)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          DEPLOYMENT_ID: ${{ needs.deployment-metadata-gate.outputs.deployment_id }}
        run: |
          set -euo pipefail

          HTTP_STATUS="$(curl -sS -o /tmp/deployment-recheck.json -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}")"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Deployment re-check lookup failed with HTTP $HTTP_STATUS. STOP -- do not promote."
            exit 1
          fi

          READY_STATE="$(jq -er '.readyState' /tmp/deployment-recheck.json)"
          TARGET="$(jq -er '.target' /tmp/deployment-recheck.json)"
          SYSTEM_SHA="$(jq -r '.meta.githubCommitSha // empty' /tmp/deployment-recheck.json)"
          CUSTOM_SHA="$(jq -r '.meta.aiscentraReleaseSha // empty' /tmp/deployment-recheck.json)"
          HAS_PROD_ALIAS="$(jq -er --arg a1 "$PRODUCTION_ALIAS_1" --arg a2 "$PRODUCTION_ALIAS_2" \
            '(.alias // []) | map(select(. == $a1 or . == $a2)) | length' /tmp/deployment-recheck.json)"

          if [ "$READY_STATE" != "READY" ]; then
            echo "::error::Re-check readyState is '$READY_STATE', expected READY. STOP -- do not promote."
            exit 1
          fi

          if [ "$TARGET" != "production" ]; then
            echo "::error::Re-check target is '$TARGET', expected production. STOP -- do not promote."
            exit 1
          fi

          if [ "$SYSTEM_SHA" != "$COMMIT_SHA" ]; then
            echo "::error::Re-check system githubCommitSha ($SYSTEM_SHA) != release commit_sha ($COMMIT_SHA). STOP -- do not promote."
            exit 1
          fi

          if [ "$CUSTOM_SHA" != "$COMMIT_SHA" ]; then
            echo "::error::Re-check custom aiscentraReleaseSha ($CUSTOM_SHA) != release commit_sha ($COMMIT_SHA). STOP -- do not promote."
            exit 1
          fi

          if [ "$HAS_PROD_ALIAS" != "0" ]; then
            echo "::error::Re-check: deployment now has a production-domain alias already assigned before promotion (expected zero). STOP -- do not promote."
            exit 1
          fi

          rm -f /tmp/deployment-recheck.json
          echo "Deployment metadata fully re-confirmed: READY, target=production, systemSha=$SYSTEM_SHA, customSha=$CUSTOM_SHA, no production alias yet."

      - name: Repeat full staged smoke (root/health/PNG) immediately before promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ needs.staged-deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail

          set +e
          npx --yes vercel@${VERCEL_CLI_VERSION} curl / \
            --deployment "$DEPLOYMENT_URL" \
            -- -o /tmp/recheck-root.html -w '%{http_code}' > /tmp/recheck-root-status.txt 2>/tmp/recheck-root-stderr.txt
          ROOT_CURL_EXIT=$?
          set -e
          [ "$ROOT_CURL_EXIT" -eq 0 ] || { echo "::error::Re-check root vercel curl failed (exit $ROOT_CURL_EXIT). STOP -- do not promote."; sed "s/${VERCEL_TOKEN}/[REDACTED]/g" /tmp/recheck-root-stderr.txt 2>/dev/null; exit 1; }
          ROOT_STATUS="$(cat /tmp/recheck-root-status.txt)"
          [ "$ROOT_STATUS" = "200" ] || { echo "::error::Re-check root returned HTTP $ROOT_STATUS. STOP -- do not promote."; exit 1; }
          grep -qi "aiscentra" /tmp/recheck-root.html || { echo "::error::Re-check root HTML not recognizable. STOP -- do not promote."; exit 1; }

          set +e
          npx --yes vercel@${VERCEL_CLI_VERSION} curl /api/health \
            --deployment "$DEPLOYMENT_URL" \
            -- -o /tmp/recheck-health.json -w '%{http_code}' > /tmp/recheck-health-status.txt 2>/tmp/recheck-health-stderr.txt
          HEALTH_CURL_EXIT=$?
          set -e
          [ "$HEALTH_CURL_EXIT" -eq 0 ] || { echo "::error::Re-check health vercel curl failed (exit $HEALTH_CURL_EXIT). STOP -- do not promote."; sed "s/${VERCEL_TOKEN}/[REDACTED]/g" /tmp/recheck-health-stderr.txt 2>/dev/null; exit 1; }
          HEALTH_STATUS="$(cat /tmp/recheck-health-status.txt)"
          [ "$HEALTH_STATUS" = "200" ] || { echo "::error::Re-check health returned HTTP $HEALTH_STATUS. STOP -- do not promote."; exit 1; }
          jq -e '.status == "ok"' /tmp/recheck-health.json > /dev/null || { echo "::error::Re-check health .status != ok. STOP -- do not promote."; exit 1; }
          jq -e '.checks.database == "ok"' /tmp/recheck-health.json > /dev/null || { echo "::error::Re-check health .checks.database != ok. STOP -- do not promote."; exit 1; }

          set +e
          npx --yes vercel@${VERCEL_CLI_VERSION} curl /opengraph-image \
            --deployment "$DEPLOYMENT_URL" \
            -- -o /tmp/recheck-og.png -D /tmp/recheck-og-headers.txt -w '%{http_code}' > /tmp/recheck-og-status.txt 2>/tmp/recheck-og-stderr.txt
          OG_CURL_EXIT=$?
          set -e
          [ "$OG_CURL_EXIT" -eq 0 ] || { echo "::error::Re-check Open Graph vercel curl failed (exit $OG_CURL_EXIT). STOP -- do not promote."; sed "s/${VERCEL_TOKEN}/[REDACTED]/g" /tmp/recheck-og-stderr.txt 2>/dev/null; exit 1; }
          OG_STATUS="$(cat /tmp/recheck-og-status.txt)"
          [ "$OG_STATUS" = "200" ] || { echo "::error::Re-check Open Graph returned HTTP $OG_STATUS. STOP -- do not promote."; exit 1; }
          RECHECK_CONTENT_TYPE="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{print $2; exit}' /tmp/recheck-og-headers.txt | tr -d '\r')"
          [[ "$RECHECK_CONTENT_TYPE" == image/png* ]] || { echo "::error::Re-check Open Graph content-type '$RECHECK_CONTENT_TYPE' != image/png. STOP -- do not promote."; exit 1; }
          RECHECK_PNG_SIG="$(head -c8 /tmp/recheck-og.png | xxd -p | head -c16)"
          [ "$RECHECK_PNG_SIG" = "$PNG_SIGNATURE_HEX" ] || { echo "::error::Re-check Open Graph PNG signature mismatch. STOP -- do not promote."; exit 1; }

          rm -f /tmp/recheck-root.html /tmp/recheck-root-status.txt /tmp/recheck-root-stderr.txt \
                /tmp/recheck-health.json /tmp/recheck-health-status.txt /tmp/recheck-health-stderr.txt \
                /tmp/recheck-og.png /tmp/recheck-og-headers.txt /tmp/recheck-og-status.txt /tmp/recheck-og-stderr.txt

          echo "Full staged smoke (root/health/PNG) re-confirmed immediately before promotion. All TOCTOU re-checks passed."

  # ---------------------------------------------------------------------
  # Job 8 (final job): explicit domain cutover, now the SOLE production-
  # mutating and verifying boundary. Replaces the previous `vercel
  # promote`-based approach: `vercel promote` can report "Success!" and
  # mark a deployment `target: "production"` internally without the
  # public domain aliases (aiscentra.com / www.aiscentra.com) actually
  # having moved -- confirmed empirically during a real release attempt.
  # A SECOND confirmed defect (post-cutover) has also been closed here:
  # a separate `post-promotion-smoke` job used to run AFTER this job had
  # already succeeded and switched both public domains, with its own
  # Open Graph/PNG checks able to fail the release with NO rollback
  # wired to them at all -- domains could be left switched to a broken
  # deployment on a failed run. That job has been REMOVED; every one of
  # its checks (root, health, exact commit SHA, required Open Graph tag,
  # Open Graph image HTTP status, content-type, PNG signature, and
  # implicit www routing via redirect-following fetch) now runs INSIDE
  # this job's own bounded verify-then-rollback loop. There is no longer
  # any check, anywhere in this workflow, that can fail a release after
  # domain mutation without triggering rollback.
  #
  # This job: determines each domain's current holder SEPARATELY (never
  # assumed shared between domains), explicitly reassigns both domains
  # via `vercel alias set`, independently re-verifies both (Vercel-side +
  # live HTTP + commit SHA + Open Graph + PNG signature) within a bounded
  # timeout, and automatically rolls every domain back to its own
  # recorded previous holder on any partial assignment failure or
  # unconfirmed verification. If a rollback attempt itself fails for one
  # domain, the other domain's rollback is still attempted, and the
  # overall result is the distinct status `ROLLBACK INCOMPLETE — MANUAL
  # RECOVERY REQUIRED`, naming exactly which domain(s) need manual
  # operator recovery and to which previous deployment ID. All decision
  # logic lives in scripts/release/domain-cutover.ts, covered by
  # scripts/release/__tests__/domain-cutover.test.ts; this job only
  # wires it to the real Vercel CLI and real HTTP checks via
  # scripts/release/run-domain-cutover.ts.
  # ---------------------------------------------------------------------
  domain-cutover:
    name: Explicit domain cutover (aiscentra.com / www.aiscentra.com)
    needs: [validate, staged-deploy, deployment-metadata-gate, pre-promotion-recheck]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout (for scripts/release only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install exact dependencies (npm ci)
        run: npm ci

      - name: Run explicit domain cutover
        id: cutover
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_SLUG: welvers-projects
          VERCEL_CLI_VERSION: 58.4.4
          STAGED_DEPLOYMENT_ID: ${{ needs.deployment-metadata-gate.outputs.deployment_id }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          CUTOVER_ARTIFACT_PATH: /tmp/domain-cutover-artifact.json
        run: npx tsx scripts/release/run-domain-cutover.ts

      - name: Upload domain cutover diagnostic artifact (no secrets)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: domain-cutover-diagnostics
          path: /tmp/domain-cutover-artifact.json
          if-no-files-found: warn
          retention-days: 90
