<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- REAL BUG FIX (owner-reported, 2026-08-27): the mark previously
       only filled 65.6% of the available viewport (edge radius 59 of
       90 half-width), leaving ~34% empty margin per side -- at real
       favicon display sizes (16-32px) this made the mark look tiny
       and hard to distinguish, confirmed by direct rendering tests.
       A single proportional scale(1.35) brings the fill to ~88.5%
       without needing to hand-recompute every radius/stroke value. -->
  <g transform="translate(90,90) scale(1.35)">
    <circle r="55" fill="none" stroke="#e5e7eb" stroke-width="8"/>
    <circle r="55" fill="none" stroke="#8B9D83" stroke-width="8" stroke-dasharray="90 260" stroke-linecap="round"/>
    <path d="M -47.6 27.5 L 0 -55 L 47.6 27.5" fill="none" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="miter"/>
    <circle cx="0" cy="-55" r="12" fill="#8B9D83"/>
    <circle cx="47.6" cy="27.5" r="10" fill="#e5e7eb"/>
    <circle cx="-47.6" cy="27.5" r="10" fill="#e5e7eb"/>
    <circle r="22" fill="#8B9D83"/>
  </g>
</svg>
